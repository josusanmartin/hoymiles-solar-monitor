; M5Stack Cardputer (ADV) as a desk display for the solar monitor website.
; It reads /api/summary over Wi-Fi; no radio needed. Settings come from the environment:
;   SOLAR_WIFI_SSID, SOLAR_WIFI_PASS   your Wi-Fi
;   SOLAR_URL                          the server, e.g. https://solar.example.com (no trailing slash)
; build + flash: pio run -t upload
[env:cardputer-display]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX @ 1.2.7
    bblanchon/ArduinoJson @ ^6.21.5
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    '-DWIFI_SSID="${sysenv.SOLAR_WIFI_SSID}"'
    '-DWIFI_PASS="${sysenv.SOLAR_WIFI_PASS}"'
    '-DSERVER_URL="${sysenv.SOLAR_URL}"'
