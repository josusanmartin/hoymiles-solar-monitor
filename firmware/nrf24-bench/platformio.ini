; nRF24 bench test for the generic ESP32 (ESP-WROOM-32) board
; wiring: CE=G4 CSN=G5 SCK=G18 MOSI=G23 MISO=G19 IRQ=G16 VCC=3V3
[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = https://github.com/nRF24/RF24.git#v1.4.8
