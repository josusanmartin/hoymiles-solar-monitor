<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<title>Inverter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/site.js"></script>
<script src="/bg.js"></script>
<style>
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 24px; margin-top: 8px; }
  .metric { border-top: 1px solid var(--line); padding: 12px 0 14px; }
  .metric .v { font-size: clamp(24px, 2.4vw, 34px); font-weight: 750; letter-spacing: -0.025em; line-height: 1.05; }
  .metric .v small { font-size: 0.45em; color: var(--ink-2); font-weight: 600; margin-left: 3px; letter-spacing: 0; }
  .metric .k { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .board { align-self: end; }
  .stage { align-items: end; }
  .pstrip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; flex: 1; min-width: 0; }
  .p h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .p .w { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; font-variation-settings: "opsz" 96, "wdth" 85; }
  .p .w small { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-left: 2px; letter-spacing: 0; }
  .p .meter { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.14); overflow: hidden; margin: 6px 0 8px; }
  .p .meter span { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #ffb627, #ffe39a); transition: width 1s ease; }
  .p dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 2px 12px; font-size: 12.5px; }
  .p dt { color: var(--muted); }
  .p dd { margin: 0; text-align: right; font-weight: 600; white-space: nowrap; }
  .strip.wide { margin-right: 0; }
  @media (max-width: 980px) {
    .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pstrip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  }
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="app">
  <nav class="nav pad" aria-label="Pages">
    <a class="brand" href="/">
      <svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="6" fill="#ffd36b"/><g stroke="#ffd36b" stroke-width="2" stroke-linecap="round"><path d="M13 1.5v3M13 21.5v3M1.5 13h3M21.5 13h3M4.9 4.9l2.1 2.1M19 19l2.1 2.1M4.9 21.1L7 19M19 7l2.1-2.1"/></g></svg>
      Solar Monitor
    </a>
    <div class="nav-r"><div class="links"><a href="/">Overview</a><a href="/live" aria-current="page">Inverter</a></div></div>
  </nav>

  <div class="stage pad">
    <section class="now" aria-live="polite">
      <div class="kicker"><span class="pulse off" id="pulse"></span><span id="kicker">Inverter on the roof</span></div>
      <div class="giant" id="giant">–</div>
      <p class="lede" id="lede">&nbsp;</p>
    </section>
    <section class="board" aria-labelledby="h-inv">
      <div class="board-head"><span class="board-title" id="h-inv">The inverter</span><span class="total" id="stamp" style="color:var(--ink-2);font-size:13px"></span></div>
      <div class="metrics" id="metrics"></div>
      <div class="board-head" style="margin-top:14px"><span class="board-title" style="font-size:16px">Connection</span><span id="diag" style="color:var(--ink-2);font-size:13px;max-width:60ch;text-align:right"></span></div>
      <div class="metrics" id="conn"></div>
    </section>
  </div>

  <div class="pad">
    <section class="strip wide" aria-label="Each panel"><div class="pstrip" id="panels"></div></section>
    <div class="credit" id="credit"></div>
  </div>
</div>

<script>
siteConfig.then(CFG => {
const TZ = CFG.timezone, PANEL_MAX = CFG.inverter.panel_max_w;
document.title = `Inverter, ${CFG.site_name}`;
const $ = id => document.getElementById(id);
const fmt = (v, d = 0) => v == null || isNaN(v) ? "–" : Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const when = ts => new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).format(new Date(ts * 1000));
const metric = (v, d, unit, k) => `<div class="metric"><div class="v">${fmt(v, d)}${unit ? `<small>${unit}</small>` : ""}</div><div class="k">${k}</div></div>`;

function render(d, age) {
  const fresh = age < 180, ac = d.ac || {};
  $("pulse").className = "pulse" + (fresh ? "" : " off");
  $("kicker").textContent = fresh ? `${d.name || CFG.inverter.model} on the roof, live` : `${d.name || CFG.inverter.model} last heard ${age < 7200 ? Math.round(age / 60) + " minutes" : Math.round(age / 3600) + " hours"} ago`;
  $("giant").innerHTML = `${fmt(fresh ? ac.P_AC : 0, 0)}<span class="u">W</span>`;
  const limit = d.limit_pct != null && d.max_pwr ? `power limit ${fmt(d.limit_pct, 0)} % of ${fmt(d.max_pwr)} W` : "power limit not read yet";
  $("lede").innerHTML = `<b>${fmt(ac.YieldDay, 0)} Wh</b> today, ${fmt(ac.YieldTotal, 0)} kWh in total. ${fmt(ac.Temp, 1)} °C inside, ${limit}.`;
  $("stamp").textContent = `Serial ${d.serial || "–"}, read at ${when(d.ts)}`;
  $("metrics").innerHTML =
    metric(ac.P_DC, 0, "W", "DC power coming in") + metric(ac.Efficiency, 1, "%", "Efficiency") +
    metric(ac.U_AC, 1, "V", "Grid voltage") + metric(ac.F_AC, 2, "Hz", "Grid frequency") +
    metric(ac.I_AC, 2, "A", "AC current") + metric(ac.Q_AC, 1, "var", "Reactive power") +
    metric(ac.PF_AC, 2, "", "Power factor") + metric(ac.MaxPower, 0, "W", "Highest since restart");
  $("panels").innerHTML = (d.channels || []).slice(0, CFG.inverter.panels).map((c, i) => {
    const w = fresh ? c.P_DC : 0;
    return `<article class="p"><h3>Panel ${i + 1}</h3><div class="w">${fmt(w, 0)}<small>W</small></div>
      <div class="meter" aria-hidden="true"><span style="width:${Math.min(100, Math.max(0, w / PANEL_MAX * 100))}%"></span></div>
      <dl><dt>Voltage</dt><dd>${fmt(c.U_DC, 1)} V</dd><dt>Current</dt><dd>${fmt(c.I_DC, 2)} A</dd>
      <dt>Today</dt><dd>${fmt(c.YieldDay, 0)} Wh</dd><dt>Total</dt><dd>${fmt(c.YieldTotal, 0)} kWh</dd>
      <dt>Irradiation</dt><dd>${fmt(c.Irradiation, 1)} %</dd></dl></article>`;
  }).join("");
}

async function renderHealth() {
  let h; try { h = await fetch("/api/health", { cache: "no-store" }).then(x => x.json()); } catch (e) { return; }
  const ago = s => s == null ? "–" : s < 120 ? `${s} s ago` : s < 7200 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`;
  const up = s => s == null ? "–" : s < 3600 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`;
  const r = h.radio, d = h.device || {};
  const m = (v, k) => `<div class="metric"><div class="v" style="font-size:22px">${v}</div><div class="k">${k}</div></div>`;
  $("conn").innerHTML =
    m(h.wifi.rssi == null ? "–" : `${h.wifi.rssi}<small>dBm</small>`, `Wi-Fi, ${h.wifi.label}`) +
    m(r && r.tx ? `${r.ok}<small>of ${r.tx}</small>` : "–", r ? `Inverter replies, last ${r.minutes} min` : "Inverter replies") +
    m(ago(h.last_reply_age), "Last inverter reply") + m(ago(h.contact_age), "Last contact with the roof") +
    m(up(d.uptime), `Running since restart (${d.reset || "–"})`) + m(String(h.restarts_last_hour), "Restarts in the last hour") +
    m(String(d.queue ?? "–"), "Readings waiting to upload") + m(String(d.fail_streak ?? "–"), "Failed uploads in a row");
  $("diag").textContent = h.message;
  const problem = !["ok", "night", "unknown"].includes(h.state);
  if (problem) { $("kicker").textContent = h.message; $("kicker").parentElement.classList.add("alert"); }
  else $("kicker").parentElement.classList.remove("alert");
}

async function tick() {
  try {
    const r = await fetch("/api/detail", { cache: "no-store" }).then(x => x.json());
    if (!r.detail) { $("lede").textContent = "No detailed reading yet. It appears after the inverter's next update."; return; }
    render(r.detail, r.age_s);
  } catch (e) { $("kicker").textContent = "Can't reach the server right now"; }
}
tick().then(renderHealth);
setInterval(() => tick().then(renderHealth), 15000);
});
</script>
</body>
</html>
